services:
  app:
    build: .
    container_name: scraper-manager
    ports:
      - "3000:3000"
    env_file:
      - .env
    volumes:
      # Persist downloaded article images on the host
      - ./news_images:/app/news_images
      # Persist scraper state (last-run timestamps) so scrapers resume correctly
      - ./last_run:/app/last_run
      # Persist application logs
      - ./logs:/app/logs
      # Persist user-uploaded images
      - ./uploaded_news_images:/app/uploaded_news_images
      - ./uploads_temp:/app/uploads_temp
      # Persist the scraper cycle config edited via the UI
      - ./scraper_cycle_config.json:/app/scraper_cycle_config.json
      # Cache InsightFace model weights so they aren't re-downloaded on restart
      - insightface_models:/root/.insightface
    restart: unless-stopped

volumes:
  insightface_models:
