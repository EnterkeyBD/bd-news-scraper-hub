<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login — Scraper Dashboard</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📰</text></svg>">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #0f1117;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        .login-card {
            background: #1a1d27;
            border: 1px solid #2e3147;
            border-radius: 16px;
            padding: 48px 40px 40px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.5);
        }

        .login-logo {
            text-align: center;
            margin-bottom: 8px;
            font-size: 48px;
        }

        .login-title {
            text-align: center;
            color: #e2e8f0;
            font-size: 22px;
            font-weight: 700;
            margin-bottom: 4px;
        }

        .login-subtitle {
            text-align: center;
            color: #64748b;
            font-size: 13px;
            margin-bottom: 36px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            color: #94a3b8;
            font-size: 13px;
            font-weight: 500;
            margin-bottom: 6px;
            letter-spacing: 0.3px;
        }

        input[type="text"],
        input[type="password"] {
            width: 100%;
            padding: 11px 14px;
            background: #0f1117;
            border: 1px solid #2e3147;
            border-radius: 8px;
            color: #e2e8f0;
            font-size: 14px;
            outline: none;
            transition: border-color 0.2s;
        }

        input[type="text"]:focus,
        input[type="password"]:focus {
            border-color: #4f6ef7;
        }

        .btn-login {
            width: 100%;
            padding: 12px;
            background: #4f6ef7;
            color: #fff;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 8px;
            transition: background 0.2s, opacity 0.2s;
        }

        .btn-login:hover { background: #3b57e0; }
        .btn-login:active { opacity: 0.85; }
        .btn-login:disabled { opacity: 0.6; cursor: not-allowed; }

        .error-msg {
            display: none;
            background: #2d1117;
            border: 1px solid #e74c3c;
            color: #f87171;
            border-radius: 8px;
            padding: 10px 14px;
            font-size: 13px;
            margin-top: 16px;
            text-align: center;
        }

        .error-msg.show { display: block; }

        .password-wrap {
            position: relative;
        }

        .password-wrap input { padding-right: 42px; }

        .toggle-pw {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: #64748b;
            cursor: pointer;
            font-size: 16px;
            line-height: 1;
            padding: 0;
        }
        .toggle-pw:hover { color: #94a3b8; }
    </style>
</head>
<body>
    <div class="login-card">
        <div class="login-logo">📰</div>
        <div class="login-title">Scraper Dashboard</div>
        <div class="login-subtitle">Sign in to continue</div>

        <form id="login-form">
            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" name="username" placeholder="Enter username" autocomplete="username" required>
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <div class="password-wrap">
                    <input type="password" id="password" name="password" placeholder="Enter password" autocomplete="current-password" required>
                    <button type="button" class="toggle-pw" id="toggle-pw" title="Show/hide password">👁</button>
                </div>
            </div>
            <button type="submit" class="btn-login" id="submit-btn">Sign In</button>
            <div class="error-msg" id="error-msg">Invalid username or password.</div>
        </form>
    </div>

    <script>
        // If already authenticated, redirect to dashboard
        fetch('/api/auth/status')
            .then(r => r.json())
            .then(data => { if (data.authenticated) window.location.href = '/'; })
            .catch(() => {});

        document.getElementById('toggle-pw').addEventListener('click', () => {
            const pw = document.getElementById('password');
            pw.type = pw.type === 'password' ? 'text' : 'password';
        });

        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('submit-btn');
            const errEl = document.getElementById('error-msg');
            errEl.classList.remove('show');
            btn.disabled = true;
            btn.textContent = 'Signing in…';

            try {
                const res = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        username: document.getElementById('username').value.trim(),
                        password: document.getElementById('password').value
                    })
                });
                const data = await res.json();
                if (data.success) {
                    window.location.href = '/';
                } else {
                    errEl.textContent = data.error || 'Invalid username or password.';
                    errEl.classList.add('show');
                    btn.disabled = false;
                    btn.textContent = 'Sign In';
                }
            } catch (err) {
                errEl.textContent = 'Server error. Please try again.';
                errEl.classList.add('show');
                btn.disabled = false;
                btn.textContent = 'Sign In';
            }
        });
    </script>
</body>
</html>
