<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scraper Scheduler</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🕐</text></svg>">
    <link rel="stylesheet" href="styles.css">
    <style>
        /* ── Page Layout ── */
        .page-body { max-width: 900px; margin: 0 auto; padding: 28px 20px; }

        /* ── Schedule Cards ── */
        .schedule-list { display: flex; flex-direction: column; gap: 14px; }

        .schedule-card {
            background: #fff;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.09);
            padding: 20px 24px;
            display: flex;
            align-items: flex-start;
            gap: 18px;
            border-left: 5px solid #6366f1;
            transition: opacity 0.2s;
        }
        .schedule-card.inactive { border-left-color: #d1d5db; opacity: 0.7; }

        .schedule-time-block {
            min-width: 80px;
            text-align: center;
            background: #eef2ff;
            border-radius: 10px;
            padding: 10px 12px;
            flex-shrink: 0;
        }
        .schedule-card.inactive .schedule-time-block { background: #f3f4f6; }
        .schedule-time-block .time-value { font-size: 1.55rem; font-weight: 800; color: #4338ca; line-height: 1; }
        .schedule-card.inactive .time-value { color: #9ca3af; }
        .schedule-time-block .time-label { font-size: 0.72rem; color: #6b7280; margin-top: 3px; text-transform: uppercase; letter-spacing: 0.05em; }

        .schedule-info { flex: 1; min-width: 0; }
        .schedule-name { font-weight: 700; color: #111827; font-size: 1rem; margin-bottom: 6px; }
        .schedule-name .inactive-tag { font-size: 0.72rem; background: #f3f4f6; color: #9ca3af; padding: 2px 8px; border-radius: 10px; font-weight: 500; margin-left: 8px; }

        .scraper-chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 4px; }
        .scraper-chip {
            display: inline-flex; align-items: center; gap: 5px;
            padding: 3px 10px;
            border-radius: 12px;
            font-size: 0.8rem;
            font-weight: 600;
            background: #e0e7ff;
            color: #3730a3;
        }
        .scraper-chip.autorun-on { background: #dcfce7; color: #15803d; }

        .schedule-actions { display: flex; gap: 8px; align-items: center; flex-shrink: 0; }

        .toggle-btn {
            padding: 6px 14px;
            border-radius: 6px;
            border: none;
            font-size: 0.82rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }
        .toggle-btn.enabled { background: #dcfce7; color: #15803d; }
        .toggle-btn.disabled { background: #f3f4f6; color: #6b7280; }
        .toggle-btn:hover { filter: brightness(0.93); }

        .icon-btn {
            width: 32px; height: 32px;
            border-radius: 6px;
            border: 1px solid #e5e7eb;
            background: #fff;
            cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            font-size: 0.9rem;
            transition: all 0.2s;
        }
        .icon-btn:hover { background: #f9fafb; border-color: #d1d5db; }
        .icon-btn.delete:hover { background: #fef2f2; border-color: #fca5a5; color: #dc2626; }

        /* ── Empty state ── */
        .empty-state { text-align: center; padding: 60px 20px; color: #9ca3af; }
        .empty-state .icon { font-size: 3.5rem; margin-bottom: 14px; }
        .empty-state p { font-size: 1rem; }

        /* ── Modal ── */
        .modal-overlay {
            display: none;
            position: fixed; inset: 0;
            background: rgba(0,0,0,0.45);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }
        .modal-overlay.open { display: flex; }

        .modal-box {
            background: #fff;
            border-radius: 14px;
            padding: 32px 32px 24px;
            width: 100%;
            max-width: 540px;
            max-height: 90vh;
            overflow-y: auto;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            animation: slideUp 0.22s ease;
        }
        @keyframes slideUp { from { transform: translateY(18px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }

        .modal-title { font-size: 1.2rem; font-weight: 800; color: #111827; margin-bottom: 22px; }

        .form-row { margin-bottom: 18px; }
        .form-row label { display: block; font-size: 0.82rem; font-weight: 600; color: #6b7280; text-transform: uppercase; letter-spacing: 0.04em; margin-bottom: 6px; }

        .form-row input[type="text"],
        .form-row input[type="time"] {
            width: 100%;
            padding: 10px 14px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            font-size: 0.95rem;
            color: #111827;
            outline: none;
            box-sizing: border-box;
            transition: border-color 0.2s;
        }
        .form-row input:focus { border-color: #6366f1; box-shadow: 0 0 0 3px rgba(99,102,241,0.15); }

        /* Scraper checklist */
        .scraper-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            max-height: 300px;
            overflow-y: auto;
            padding: 2px;
        }
        .scraper-check-item {
            display: flex; align-items: center; gap: 8px;
            padding: 9px 12px;
            border: 1.5px solid #e5e7eb;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.15s;
            user-select: none;
        }
        .scraper-check-item:hover { border-color: #a5b4fc; background: #eef2ff; }
        .scraper-check-item.checked { border-color: #6366f1; background: #eef2ff; }
        .scraper-check-item.autorun-warning { border-color: #fbbf24; }
        .scraper-check-item.autorun-warning.checked { border-color: #f59e0b; background: #fffbeb; }
        .scraper-check-item input[type="checkbox"] { width: 16px; height: 16px; accent-color: #6366f1; flex-shrink: 0; cursor: pointer; }
        .scraper-check-item .item-name { font-size: 0.87rem; font-weight: 600; color: #374151; flex: 1; }
        .scraper-check-item .autorun-icon { font-size: 0.7rem; color: #f59e0b; }

        .select-all-row { display: flex; gap: 10px; margin-bottom: 8px; }
        .select-all-row button { padding: 4px 12px; border: 1px solid #d1d5db; border-radius: 6px; background: #f9fafb; font-size: 0.82rem; cursor: pointer; }
        .select-all-row button:hover { background: #f3f4f6; }

        .legend { display: flex; gap: 16px; font-size: 0.78rem; color: #9ca3af; margin-top: 6px; }
        .legend span { display: flex; align-items: center; gap: 4px; }

        .modal-actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 24px; padding-top: 16px; border-top: 1px solid #f3f4f6; }
        .btn-cancel { padding: 9px 20px; background: #f3f4f6; border: none; border-radius: 8px; font-weight: 600; cursor: pointer; color: #374151; }
        .btn-cancel:hover { background: #e5e7eb; }
        .btn-save { padding: 9px 24px; background: #6366f1; color: #fff; border: none; border-radius: 8px; font-weight: 700; cursor: pointer; transition: background 0.2s; }
        .btn-save:hover { background: #4f46e5; }
        .btn-save:disabled { opacity: 0.6; cursor: not-allowed; }

        /* Toast */
        .toast {
            position: fixed; bottom: 24px; right: 24px;
            background: #1f2937; color: #fff;
            padding: 12px 20px; border-radius: 8px;
            font-size: 0.9rem; font-weight: 500;
            opacity: 0; transform: translateY(8px);
            transition: all 0.25s;
            pointer-events: none; z-index: 9999;
        }
        .toast.show { opacity: 1; transform: translateY(0); }
        .toast.success { background: #15803d; }
        .toast.error   { background: #b91c1c; }

        /* Header add btn */
        .header-add-btn {
            padding: 10px 22px;
            background: #6366f1;
            color: #fff; border: none;
            border-radius: 8px; font-weight: 700;
            font-size: 0.95rem; cursor: pointer;
            transition: background 0.2s;
        }
        .header-add-btn:hover { background: #4f46e5; }

        .page-header {
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 24px;
        }
        .page-header h2 { font-size: 1.3rem; font-weight: 800; color: #111827; }
        .page-header .sub { font-size: 0.85rem; color: #9ca3af; margin-top: 2px; }

        .count-badge {
            display: inline-block;
            background: #eef2ff;
            color: #4f46e5;
            border-radius: 12px;
            padding: 1px 10px;
            font-size: 0.82rem;
            font-weight: 700;
            margin-left: 6px;
        }
    </style>
</head>
<body>
<div class="container">
    <header>
        <h1>🕐 Scraper Scheduler</h1>
        <div class="header-actions">
            <a href="index.html" class="btn btn-secondary btn-sm">← Dashboard</a>
        </div>
    </header>

    <div class="page-body">
        <div class="page-header">
            <div>
                <h2>Scheduled Jobs <span class="count-badge" id="schedule-count">0</span></h2>
                <div class="sub">Scrapers run automatically at the times you set. Multiple schedules can be active at once.</div>
            </div>
            <button class="header-add-btn" onclick="openAddModal()">＋ Add Schedule</button>
        </div>

        <div class="schedule-list" id="schedule-list">
            <div class="empty-state">
                <div class="icon">📭</div>
                <p>Loading schedules…</p>
            </div>
        </div>
    </div>
</div>

<!-- Add/Edit Modal -->
<div class="modal-overlay" id="modal-overlay" onclick="handleOverlayClick(event)">
    <div class="modal-box">
        <div class="modal-title" id="modal-title">Add Schedule</div>

        <div class="form-row">
            <label>Label (optional)</label>
            <input type="text" id="f-label" placeholder="e.g. Morning run, Night batch…" maxlength="100">
        </div>

        <div class="form-row">
            <label>Time <span style="color:#ef4444">*</span></label>
            <input type="time" id="f-time" required>
        </div>

        <div class="form-row">
            <label>Select Scrapers <span style="color:#ef4444">*</span></label>
            <div class="select-all-row">
                <button onclick="selectAllScrapers()">Select All</button>
                <button onclick="clearAllScrapers()">Clear All</button>
            </div>
            <div class="scraper-grid" id="scraper-grid">
                <!-- populated by JS -->
            </div>
            <div class="legend">
                <span>🟡 = Autorun enabled (will show confirmation)</span>
            </div>
        </div>

        <div class="modal-actions">
            <button class="btn-cancel" onclick="closeModal()">Cancel</button>
            <button class="btn-save" id="btn-save" onclick="saveSchedule()">Save Schedule</button>
        </div>
    </div>
</div>

<div class="toast" id="toast"></div>

<script>
// ── Constants ────────────────────────────────────────────────────────────────
const SCRAPERS_LIST = [
    { id: 'ittefaq',      name: 'Ittefaq' },
    { id: 'jugantor',     name: 'Jugantor' },
    { id: 'kalbela',      name: 'Kalbela' },
    { id: 'desh',         name: 'Desh TV' },
    { id: 'dhakapost',    name: 'DhakaPost' },
    { id: 'jagonews24',   name: 'Jagonews24' },
    { id: 'bdnews24',     name: 'BDNews24' },
    { id: 'prothomalo',   name: 'Prothom Alo' },
    { id: 'samakal',      name: 'Samakal' },
    { id: 'sangbad',      name: 'Sangbad' },
    { id: 'amadershomoy', name: 'AmaderShomoy' },
    { id: 'bdpratidin',   name: 'BD Pratidin' },
    { id: 'mzamin',       name: 'Mzamin' },
    { id: 'dhakatribune', name: 'Dhaka Tribune' },
    { id: 'janakantha',   name: 'Janakantha' },
    { id: 'boishakhi',    name: 'Boishakhi' },
];

let autorunMap = {};     // { scraperId: 0|1 }
let schedules  = [];
let editingId  = null;

// ── Init ──────────────────────────────────────────────────────────────────────
async function init() {
    await loadAutorunStatus();
    buildScraperGrid();
    await loadSchedules();
}

async function loadAutorunStatus() {
    try {
        const r = await fetch('/api/scrapers');
        const data = await r.json();
        // Response is an object keyed by scraper ID: { ittefaq: { autorun: 1, ... }, ... }
        for (const [id, info] of Object.entries(data)) {
            autorunMap[id] = info.autorun ?? 0;
        }
    } catch(e) {
        // fallback: assume 0
        SCRAPERS_LIST.forEach(s => { autorunMap[s.id] = 0; });
    }
}

// ── Scraper grid (in modal) ───────────────────────────────────────────────────
function buildScraperGrid() {
    const grid = document.getElementById('scraper-grid');
    grid.innerHTML = SCRAPERS_LIST.map(s => {
        const isAutorun = autorunMap[s.id] === 1;
        return `
        <label class="scraper-check-item${isAutorun ? ' autorun-warning' : ''}" id="item-${s.id}" onclick="handleScraperClick(event,'${s.id}',${isAutorun})">
            <input type="checkbox" id="cb-${s.id}" value="${s.id}" onclick="event.stopPropagation(); handleScraperClick(event,'${s.id}',${isAutorun})">
            <span class="item-name">${s.name}</span>
            ${isAutorun ? '<span class="autorun-icon" title="Autorun enabled for this scraper">🟡</span>' : ''}
        </label>`;
    }).join('');
}

function handleScraperClick(event, id, isAutorun) {
    event.preventDefault();
    event.stopPropagation();
    const cb = document.getElementById(`cb-${id}`);
    const item = document.getElementById(`item-${id}`);
    const willCheck = !cb.checked;

    if (willCheck && isAutorun) {
        if (!confirm(`⚠️ "${getScraperName(id)}" has Autorun enabled.\n\nIt is already scheduled to start automatically.\n\nAre you sure you want to include it in this custom schedule too?`)) {
            return;
        }
    }
    cb.checked = willCheck;
    item.classList.toggle('checked', willCheck);
}

function getScraperName(id) {
    return SCRAPERS_LIST.find(s => s.id === id)?.name || id;
}

function selectAllScrapers() {
    SCRAPERS_LIST.forEach(s => {
        document.getElementById(`cb-${s.id}`).checked = true;
        document.getElementById(`item-${s.id}`).classList.add('checked');
    });
}

function clearAllScrapers() {
    SCRAPERS_LIST.forEach(s => {
        document.getElementById(`cb-${s.id}`).checked = false;
        document.getElementById(`item-${s.id}`).classList.remove('checked');
    });
}

function getCheckedScrapers() {
    return SCRAPERS_LIST.map(s => s.id).filter(id => document.getElementById(`cb-${id}`)?.checked);
}

function setCheckedScrapers(ids) {
    clearAllScrapers();
    ids.forEach(id => {
        const cb = document.getElementById(`cb-${id}`);
        const item = document.getElementById(`item-${id}`);
        if (cb) { cb.checked = true; item.classList.add('checked'); }
    });
}

// ── Modal ─────────────────────────────────────────────────────────────────────
function openAddModal() {
    editingId = null;
    document.getElementById('modal-title').textContent = 'Add Schedule';
    document.getElementById('f-label').value = '';
    document.getElementById('f-time').value = '';
    clearAllScrapers();
    document.getElementById('modal-overlay').classList.add('open');
}

function openEditModal(id) {
    const s = schedules.find(x => x.id === id);
    if (!s) return;
    editingId = id;
    document.getElementById('modal-title').textContent = 'Edit Schedule';
    document.getElementById('f-label').value = s.label || '';
    document.getElementById('f-time').value = s.schedule_time.substring(0, 5);
    setCheckedScrapers(s.scraper_ids);
    document.getElementById('modal-overlay').classList.add('open');
}

function closeModal() {
    document.getElementById('modal-overlay').classList.remove('open');
}

function handleOverlayClick(e) {
    if (e.target === document.getElementById('modal-overlay')) closeModal();
}

// ── Save ──────────────────────────────────────────────────────────────────────
async function saveSchedule() {
    const label = document.getElementById('f-label').value.trim();
    const time  = document.getElementById('f-time').value;
    const ids   = getCheckedScrapers();

    if (!time)           { showToast('Please set a time.', 'error'); return; }
    if (ids.length === 0){ showToast('Select at least one scraper.', 'error'); return; }

    const btn = document.getElementById('btn-save');
    btn.disabled = true;

    try {
        let res;
        if (editingId) {
            const s = schedules.find(x => x.id === editingId);
            res = await fetch(`/api/schedules/${editingId}`, {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ label, schedule_time: time, scraper_ids: ids, is_active: s?.is_active ?? 1 })
            });
        } else {
            res = await fetch('/api/schedules', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ label, schedule_time: time, scraper_ids: ids })
            });
        }
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || 'Server error');
        closeModal();
        showToast(editingId ? 'Schedule updated.' : 'Schedule added.', 'success');
        await loadSchedules();
    } catch (e) {
        showToast(e.message, 'error');
    } finally {
        btn.disabled = false;
    }
}

// ── Load & Render ─────────────────────────────────────────────────────────────
async function loadSchedules() {
    try {
        const r = await fetch('/api/schedules');
        schedules = await r.json();
    } catch(e) {
        schedules = [];
    }
    renderSchedules();
}

function formatTime12(timeStr) {
    if (!timeStr) return '—';
    const [h, m] = timeStr.split(':').map(Number);
    const ampm = h >= 12 ? 'PM' : 'AM';
    const h12  = h % 12 || 12;
    return `${String(h12).padStart(2,'0')}:${String(m).padStart(2,'0')} ${ampm}`;
}
function formatTime12Parts(timeStr) {
    if (!timeStr) return { hm: '—', ampm: '' };
    const [h, m] = timeStr.split(':').map(Number);
    const ampm = h >= 12 ? 'PM' : 'AM';
    const h12  = h % 12 || 12;
    return { hm: `${String(h12).padStart(2,'0')}:${String(m).padStart(2,'0')}`, ampm };
}

function renderSchedules() {
    const list = document.getElementById('schedule-list');
    document.getElementById('schedule-count').textContent = schedules.length;

    if (schedules.length === 0) {
        list.innerHTML = `<div class="empty-state"><div class="icon">📭</div><p>No schedules yet. Click <strong>+ Add Schedule</strong> to create one.</p></div>`;
        return;
    }

    list.innerHTML = schedules.map(s => {
        const active = s.is_active === 1;
        const chips  = s.scraper_ids.map(id => {
            const name = getScraperName(id);
            const ar   = autorunMap[id] === 1;
            return `<span class="scraper-chip${ar ? ' autorun-on' : ''}" title="${ar ? 'Autorun enabled' : ''}">${ar ? '🟡 ' : ''}${name}</span>`;
        }).join('');
        const time24 = s.schedule_time ? s.schedule_time.substring(0,5) : '';
        const tp = formatTime12Parts(time24);
        return `
        <div class="schedule-card${active ? '' : ' inactive'}" id="scard-${s.id}">
            <div class="schedule-time-block">
                <div class="time-value">${tp.hm}</div>
                <div class="time-label">${tp.ampm} · Daily</div>
            </div>
            <div class="schedule-info">
                <div class="schedule-name">
                    ${s.label ? escHtml(s.label) : `Schedule at ${formatTime12(time24)}`}
                    ${!active ? '<span class="inactive-tag">Paused</span>' : ''}
                </div>
                <div class="scraper-chips">${chips}</div>
                <div style="margin-top:6px;font-size:0.78rem;color:#9ca3af;">${s.scraper_ids.length} scraper${s.scraper_ids.length !== 1 ? 's' : ''}</div>
            </div>
            <div class="schedule-actions">
                <button class="toggle-btn ${active ? 'enabled' : 'disabled'}" onclick="toggleSchedule(${s.id})" title="${active ? 'Click to pause' : 'Click to enable'}">
                    ${active ? '✅ Active' : '⏸ Paused'}
                </button>
                <button class="icon-btn" onclick="openEditModal(${s.id})" title="Edit">✏️</button>
                <button class="icon-btn delete" onclick="deleteSchedule(${s.id})" title="Delete">🗑</button>
            </div>
        </div>`;
    }).join('');
}

function escHtml(str) {
    return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// ── Toggle/Delete ─────────────────────────────────────────────────────────────
async function toggleSchedule(id) {
    try {
        const r = await fetch(`/api/schedules/${id}/toggle`, { method: 'PATCH' });
        const d = await r.json();
        if (!r.ok) throw new Error(d.error);
        const s = schedules.find(x => x.id === id);
        if (s) s.is_active = d.is_active;
        renderSchedules();
        showToast(d.is_active ? 'Schedule enabled.' : 'Schedule paused.', 'success');
    } catch(e) { showToast(e.message, 'error'); }
}

async function deleteSchedule(id) {
    const s = schedules.find(x => x.id === id);
    const label = s?.label || `Schedule at ${formatTime12((s?.schedule_time||'').substring(0,5))}`;
    if (!confirm(`Delete "${label}"?\n\nThis cannot be undone.`)) return;
    try {
        const r = await fetch(`/api/schedules/${id}`, { method: 'DELETE' });
        const d = await r.json();
        if (!r.ok) throw new Error(d.error);
        showToast('Schedule deleted.', 'success');
        await loadSchedules();
    } catch(e) { showToast(e.message, 'error'); }
}

// ── Toast ─────────────────────────────────────────────────────────────────────
let toastTimer = null;
function showToast(msg, type = '') {
    const el = document.getElementById('toast');
    el.textContent = msg;
    el.className = `toast show${type ? ' ' + type : ''}`;
    if (toastTimer) clearTimeout(toastTimer);
    toastTimer = setTimeout(() => { el.classList.remove('show'); }, 3000);
}

// ── Keyboard ──────────────────────────────────────────────────────────────────
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });

// ── Boot ──────────────────────────────────────────────────────────────────────
init();
</script>
</body>
</html>
